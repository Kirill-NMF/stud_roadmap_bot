name: tests

on:
  push:
  pull_request:

jobs:
  roadmap-pipeline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run pipeline tests
        run: python3 scripts/roadmap_pipeline_tests.py

